name: macOS build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-build:
    name: Universal Release build
    runs-on: xcode-27
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build LiveDesk
        run: |
          xcodebuild -version
          xcodebuild -project Wallpaper.xcodeproj -scheme Wallpaper \
            -configuration Release -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/LiveDeskBuild" \
            PRODUCT_BUNDLE_IDENTIFIER=com.jeffrey.Wallpaper.BuildCheck \
            CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=NO ARCHS='arm64 x86_64' build
      - name: Verify bundle contents
        run: |
          app="$RUNNER_TEMP/LiveDeskBuild/Build/Products/Release/Wallpaper.app"
          executable="$app/Contents/MacOS/Wallpaper"
          architectures=$(xcrun lipo -archs "$executable")
          for architecture in arm64 x86_64; do
            if [[ " $architectures " != *" $architecture "* ]]; then
              echo "Missing $architecture from the built executable." >&2
              exit 1
            fi
            minimum=$(xcrun vtool -arch "$architecture" -show-build "$executable" | awk '$1 == "minos" { print $2 }')
            if [[ "$minimum" != 14.0 ]]; then
              echo "Expected macOS 14.0 minimum for $architecture, got '$minimum'." >&2
              exit 1
            fi
          done
          test -s "$app/Contents/Resources/sample.mp4"
          test -s "$app/Contents/Resources/AppIcon.icns"
